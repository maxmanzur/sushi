name = "sushi-b3p"
compatibility_date = "2026-11-20"
pages_build_output_dir = "./public"

# Producción: base real. Mantener UBER_ENABLED bloqueado.
[[d1_databases]]
binding = "DB"
database_name = "sushi-db"
database_id = "f6ddd9d0-55ce-4de2-b534-eb5ec87dd84f"

[vars]
UBER_ENABLED = "false"
UBER_DRY_RUN = "false"
UBER_API_CONTRACT_VERIFIED = "false"

# Preview: base aislada y despacho real bloqueado.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "sushi-preview-db"
database_id = "7296331d-e8ae-46b9-9032-ae4bb50cac32"

[env.preview.vars]
UBER_ENABLED = "false"
UBER_DRY_RUN = "false"
UBER_API_CONTRACT_VERIFIED = "false"
