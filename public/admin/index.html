<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111115"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/admin.css"><title>Administración | GOTOKU SUSHI</title></head>
<body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">G</span><span class="brand-copy"><strong>GOTOKU SUSHI</strong><small>ADMINISTRACIÓN</small></span></a></header>
<main class="container admin-container"><section class="hero"><p class="eyebrow">GESTIÓN</p><h1>Administración</h1></section>
<form id="login" class="checkout-form product-card" hidden><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Ingresar</button></form>
<section id="panel" hidden><div class="section-heading"><h2>Pedidos</h2><button id="logout" class="button" type="button">Cerrar sesión</button></div>
<div class="admin-toolbar"><button id="sound-toggle" class="button button-primary" type="button">Activar sonido</button><p class="admin-note">La alerta suena solo con este panel abierto.</p></div>
<div class="admin-filters"><label>Estado<select id="filter-status"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="aceptado">Aceptado</option><option value="en_preparacion">En preparación</option><option value="listo_para_retirar">Listo para retirar</option><option value="enviado">Enviado</option><option value="entregado">Entregado</option><option value="cancelado">Cancelado</option></select></label><label>Desde<input id="filter-date" type="date"></label><label>Hasta<input id="filter-until" type="date"></label></div>
<div id="orders" aria-live="polite"></div><button id="load-more" class="button load-more" type="button" hidden>Cargar más</button>
<h2>Productos y precios</h2><div id="products"></div></section><div id="admin-message" class="notice" role="status" hidden></div></main>
<script type="module" src="/js/admin.js"></script></body></html>
